name: CI/CD Pipeline — Sentiment Analysis API

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"
  IMAGE_NAME: sentiment-analysis-api

jobs:

# ─────────────────────────────────────────────
# 1. Lint & Static Analysis
# ─────────────────────────────────────────────
  lint:
    name: Lint Code
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Install lint tools
        run: pip install ruff

      - name: Run lint
        run: ruff check app/

# ─────────────────────────────────────────────
# 2. Tests
# ─────────────────────────────────────────────
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-timeout

      - name: Create reports folder
        run: mkdir -p reports

      - name: Run tests
        run: |
          pytest tests/ -v --timeout=60

# ─────────────────────────────────────────────
# 3. Build Docker Image
# ─────────────────────────────────────────────
  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          load: true
          tags: ${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

# ─────────────────────────────────────────────
# 4. Smoke Test (Container)
# ─────────────────────────────────────────────
  smoke-test:
    name: Smoke Test Container
    runs-on: ubuntu-latest
    needs: build

    steps:
      - uses: actions/checkout@v4

      - name: Build image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          load: true
          tags: ${{ env.IMAGE_NAME }}:test

      - name: Run container
        run: |
          docker run -d --name app -p 8000:8000 ${{ env.IMAGE_NAME }}:test

      - name: Wait for API
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:8000/health && exit 0
            sleep 2
          done
          echo "API failed to start"
          docker logs app
          exit 1

      - name: Test endpoint
        run: |
          curl -sf -X POST http://localhost:8000/predict \
          -H "Content-Type: application/json" \
          -d '{"text":"I love this product"}'

      - name: Stop container
        if: always()
        run: docker rm -f app